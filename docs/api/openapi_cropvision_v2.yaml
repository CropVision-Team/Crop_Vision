openapi: 3.1.0
info:
  title: CropVision Enterprise Agronomy & Diagnostic Cloud API
  version: 2.4.0
  description: |
    Comprehensive OpenAPI 3.1 specification for the CropVision platform.
    Orchestrates real-time neural edge inference, satellite remote sensing,
    APMC mandi agricultural commodity price aggregation, and precision agronomy.
  contact:
    name: CropVision Agronomic Systems Team
    email: ripansamuix08@users.noreply.github.com
    url: https://github.com/CropVision-Team/CropVision
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.cropvision.ai/v2
    description: Production Global Edge Cluster
  - url: https://staging-api.cropvision.ai/v2
    description: Staging Validation Cluster

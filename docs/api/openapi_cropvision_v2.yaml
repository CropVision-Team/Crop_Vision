      summary: Upload Leaf Image for Multi-Model Disease Diagnosis
      operationId: inference_post__diagnoses_scan_leaf
      parameters:
        - name: X-CropVision-Client-Version
          in: header
          required: false
          schema:
            type: string
            default: '2.4.0'
      responses:
        '200':
          description: Successful execution of Upload Leaf Image for Multi-Model Disease Diagnosis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
